name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build dictionary and packages
        run: python3 -I build.py

      - name: Committed dictionary matches a fresh build
        run: git diff --exit-code -- uz_UZ-2026.dic uz_UZ-2026.aff build-report.json

      - name: Package hashes
        run: |
          {
            echo '### Packages'
            echo '```'
            sha256sum dist/*
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Hunspell and LibreOffice
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends hunspell libreoffice-writer-nogui python3-uno

      - name: Morphology and spell-check behaviour (Hunspell)
        run: python3 -I tools/verify.py --upstream .cache/uz-hunspell --hunspell "$(command -v hunspell)" --sample 300

      - name: Spell-check inside LibreOffice (Writer path)
        run: python3 tools/lo_test.py --soffice "$(command -v soffice)" --oxt "dist/bitg-hunspell-$(cat VERSION)-libreoffice.oxt"
